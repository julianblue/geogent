# Railway configuration for the geogent UI (Next.js).
#
# In Railway, create a service from this repo with:
#   Root Directory  = apps/ui
#   Config Path     = railway.toml   (auto-detected)
#
# Required environment variables (set in the Railway service):
#   BACKEND_URL=https://<backend-service>.up.railway.app
#   LANGGRAPH_URL=https://<agent-service>.up.railway.app
#   NEXT_PUBLIC_LANGGRAPH_GRAPH_ID=geogent
#
# Optional:
#   LANGCHAIN_API_KEY=...   # only if your agent service requires it

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.production"

[deploy]
# Railway runs the startCommand under `sh -c`, so $PORT is expanded by the
# wrapping shell. Avoid extra quoting that would block the substitution.
startCommand = "pnpm next start -p ${PORT:-3000}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
