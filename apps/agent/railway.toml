# Railway configuration for the geogent LangGraph agent.
#
# In Railway, create a service from this repo with:
#   Root Directory  = apps/agent
#   Config Path     = railway.toml   (auto-detected)
#
# Required environment variables:
#   BACKEND_URL=https://<backend-service>.up.railway.app
#
#   # Plain libpq DSN (no SQLAlchemy/asyncpg prefix). Same database as
#   # the backend; checkpoint tables live in a dedicated `langgraph` schema.
#   AGENT_DATABASE_URL=postgresql://<user>:<pw>@<host>:<port>/<db>
#   POSTGRES_URI=${{ AGENT_DATABASE_URL }}
#
# One LLM provider key (matching AGENT_MODEL — see apps/agent/.env.example):
#   ANTHROPIC_API_KEY=...   # for claude-*
#   OPENAI_API_KEY=...      # for gpt-*
#   OPENROUTER_API_KEY=...  # for openrouter:<vendor>/<model>
#
# Optional:
#   AGENT_MODEL=claude-sonnet-4-6
#   LANGSMITH_API_KEY=...
#   LANGSMITH_TRACING=true
#   LANGSMITH_PROJECT=geogent

[build]
builder = "DOCKERFILE"
# Production image is generated by `langgraph dockerfile` and checked in.
# The base image (langchain/langgraph-api) reads $POSTGRES_URI and wires
# the Postgres checkpointer itself — do NOT compile a checkpointer into
# the graphs.
dockerfilePath = "Dockerfile.langgraph"

[deploy]
# Idempotent schema migration for the LangGraph checkpointer. Runs once
# per deploy before the server starts. Schema creation is gated by
# AGENT_DATABASE_URL.
preDeployCommand = "./scripts/migrate.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
