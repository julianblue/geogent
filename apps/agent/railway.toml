# Railway configuration for the geogent LangGraph agent.
#
# In Railway, create a service from this repo with:
#   Root Directory  = apps/agent
#   Config Path     = railway.toml   (auto-detected)
#
# Required environment variables:
#   BACKEND_URL=https://<backend-service>.up.railway.app
#
# One LLM provider key (matching AGENT_MODEL — see apps/agent/.env.example):
#   ANTHROPIC_API_KEY=...   # for claude-*
#   OPENAI_API_KEY=...      # for gpt-*
#   OPENROUTER_API_KEY=...  # for openrouter:<vendor>/<model>
#
# Optional:
#   AGENT_MODEL=claude-sonnet-4-6
#
# LangSmith observability (all optional). The agent logs on boot whether
# tracing is enabled. Use a per-environment project so prod traces stay
# clean. Runs are auto-tagged with architecture / provider / model.
#   LANGSMITH_API_KEY=...
#   LANGSMITH_TRACING=true
#   LANGSMITH_PROJECT=geogent-prod
#   LANGSMITH_ENDPOINT=https://api.smith.langchain.com   # EU / self-hosted
#   LANGSMITH_SAMPLING_RATE=1.0
#   LANGSMITH_HIDE_INPUTS=false
#   LANGSMITH_HIDE_OUTPUTS=false

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT; the langgraph dev server binds to it.
startCommand = "uv run langgraph dev --host 0.0.0.0 --port ${PORT:-2024} --no-browser"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
